<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="785px" preserveAspectRatio="none" style="width:1374px;height:785px;background:#FFFFFF;" version="1.1" viewBox="0 0 1374 785" width="1374px" zoomAndPan="magnify"><title>Isochronous transfer - flat-buffer strategy
//WIT extension contributed by this work//</title><defs/><g><g class="title" data-source-line="8"><text fill="#000000" font-family="'Helvetica'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="433.9521" x="465.8229" y="31.9404">Isochronous transfer - flat-buffer strategy</text><text fill="#000000" font-family="'Helvetica'" font-size="22" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="410.6953" x="477.4513" y="53.9404">WIT extension contributed by this work</text></g><!--cluster xfer--><g class="cluster" data-entity="xfer" data-source-line="10" data-uid="ent0002" id="cluster_xfer"><rect fill="#FFEBC8" height="159" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="535" x="12" y="77"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="79.4653" x="239.7673" y="87.4702">libusb_transfer</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="131.7422" x="213.6289" y="98.4702">``num_iso_packets = 32``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="155.606" x="201.697" y="109.4702">``length = 32 &#215; 1024 = 32 768``</text></g><!--cluster cb--><g class="cluster" data-entity="cb" data-source-line="15" data-uid="ent0005" id="cluster_cb"><rect fill="#D5EAD8" height="454.5" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="304" x="243" y="319"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="90.4976" x="316.147" y="329.4702">transfer_callback</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.1523" x="409.7007" y="329.4702">(host C-ABI)</text></g><!--cluster result--><g class="cluster" data-entity="result" data-source-line="25" data-uid="ent0012" id="cluster_result"><rect fill="#DCEFFB" height="104" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="424" x="587" y="477"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="77.6338" x="726.2673" y="487.4702">TransferResult</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.7754" x="806.9573" y="487.4702">(WIT record)</text></g><!--cluster guest--><g class="cluster" data-entity="guest" data-source-line="32" data-uid="ent0016" id="cluster_guest"><rect fill="#DCEFFB" height="137" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="279" x="732" y="642"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="31.1738" x="811.2874" y="652.4702">Guest</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="86.1953" x="845.5173" y="652.4702">(e.g. webcam.rs)</text></g><!--entity descs--><g class="entity" data-entity="descs" data-source-line="11" data-uid="ent0003" id="entity_descs"><rect fill="#EDEDED" height="75" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="150.2705" x="35.86" y="137"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="88.0537" x="45.86" y="155.4702">iso_packet_desc[]</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="124.1528" x="45.86" y="166.4702">[0] length=1024 actual=...</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="124.1528" x="45.86" y="177.4702">[1] length=1024 actual=...</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="11" x="45.86" y="188.4702">&#8230;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="130.2705" x="45.86" y="199.4702">[31] length=1024 actual=...</text></g><!--entity buf--><g class="entity" data-entity="buf" data-source-line="12" data-uid="ent0004" id="entity_buf"><rect fill="#FFF6CC" height="53" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="282.6304" x="220.68" y="148"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="53.1846" x="230.68" y="166.4702">buffer (flat)</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="223.1421" x="230.68" y="177.4702">``[ pkt0 stride | pkt1 stride | &#8230; | pkt31 stride ]``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="262.6304" x="230.68" y="188.4702">each stride = packet_size, regardless of actual_length</text></g><!--entity walk--><g class="entity" data-entity="walk" data-source-line="16" data-uid="ent0006" id="entity_walk"><rect fill="#FFFFFF" height="42" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="236.4282" x="266.79" y="357"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="118.6099" x="276.79" y="375.4702">Walk iso_packet_desc[]:</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="216.4282" x="276.79" y="386.4702">``packet_results: Vec&lt;(actual_len, status)&gt;``</text></g><!--entity copy--><g class="entity" data-entity="copy" data-source-line="17" data-uid="ent0007" id="entity_copy"><rect fill="#FFFFFF" height="42" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="166.7168" x="301.64" y="515"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="119.8237" x="311.64" y="533.4702">Copy full ``length`` bytes</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="146.7168" x="311.64" y="544.4702">from flat ``buffer`` &#8594; Vec&lt;u8&gt;</text></g><!--entity send--><g class="entity" data-entity="send" data-source-line="18" data-uid="ent0008" id="entity_send"><rect fill="#FFFFFF" height="64" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="137.4121" x="316.29" y="685.5"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="117.4121" x="326.29" y="703.9702">Send via tokio::oneshot:</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="80.0723" x="326.29" y="714.9702">``Ok(Vec&lt;u8&gt;)``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="111.8906" x="326.29" y="725.9702">Store packet_results in</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="95.9707" x="326.29" y="736.9702">``Arc&lt;Mutex&lt;...&gt;&gt;``</text></g><!--entity rdata--><g class="entity" data-entity="rdata" data-source-line="26" data-uid="ent0013" id="entity_rdata"><rect fill="#FFFFFF" height="42" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="164.3052" x="610.85" y="515"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="66.0483" x="620.85" y="533.4702">data: list&lt;u8&gt;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="144.3052" x="620.85" y="544.4702">flat: pkt0|pkt1|&#8230;|pkt31 strides</text></g><!--entity rpkts--><g class="entity" data-entity="rpkts" data-source-line="27" data-uid="ent0014" id="entity_rpkts"><rect fill="#FFFFFF" height="42" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="157.5859" x="810.21" y="515"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="120.4468" x="820.21" y="533.4702">packets: list&lt;iso-packet&gt;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="137.5859" x="820.21" y="544.4702">[ {actual_length, status}, &#8230; ]</text></g><!--entity parse--><g class="entity" data-entity="parse" data-source-line="33" data-uid="ent0017" id="entity_parse"><rect fill="#FFFFFF" height="75" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="212.0059" x="756" y="680"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="111.2676" x="766" y="698.4702">for i in 0..packets.len():</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="73.6646" x="772.1123" y="709.4702">start = i * stride</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="185.8936" x="772.1123" y="720.4702">end   = start + packets[i].actual_length</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="131.7852" x="772.1123" y="731.4702">payload = &amp;data[start..end]</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="168.1528" x="772.1123" y="742.4702">parse UVC header / append frame</text></g><g class="entity" data-entity="GMN19" data-source-line="39" data-uid="ent0020" id="entity_GMN19"><path d="M1038.41,524 L1038.41,548 A4,4 0 0 0 1042.41,552 L1363.598,552 A4,4 0 0 0 1367.598,548 L1367.598,530 L1357.598,520 L1042.41,520 A4,4 0 0 0 1038.41,524" fill="#FFF6CC" style="stroke:#000000;stroke-width:1;"/><path d="M1357.598,520 L1357.598,528 A2,2 0 0 0 1359.598,530 L1367.598,530 L1357.598,520" fill="#FFF6CC" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="293.5088" x="1044.41" y="533.4702">list&lt;list&lt;u8&gt;&gt; is not supported in the stable component ABI -</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="308.188" x="1044.41" y="544.4702">flat buffer + packets metadata = one copy across the boundary.</text></g><!--link walk to copy--><g class="link" data-entity-1="walk" data-entity-2="copy" data-source-line="19" data-uid="lnk9" id="link_walk_copy"><path d="M385,399.39 C385,429.29 385,478.7 385,508.6" fill="none" id="walk-to-copy" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="385,514.6,389,505.6,385,509.6,381,505.6,385,514.6" style="stroke:#444444;stroke-width:1;"/></g><!--link copy to send--><g class="link" data-entity-1="copy" data-entity-2="send" data-source-line="20" data-uid="lnk10" id="link_copy_send"><path d="M385,557.24 C385,588.42 385,642.42 385,679.21" fill="none" id="copy-to-send" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="385,685.21,389,676.21,385,680.21,381,676.21,385,685.21" style="stroke:#444444;stroke-width:1;"/></g><!--link xfer to cb--><g class="link" data-entity-1="xfer" data-entity-2="cb" data-source-line="23" data-uid="lnk11" id="link_xfer_cb"><path d="M539,236.1167 C539,237.529 539,238.9539 539,240.3899 C539,251.8781 539,264.0819 539,276.285 C539,288.4881 539,300.6906 539,312.1764 C539,313.6121 539,315.0366 539,316.4485 C539,317.1545 539,311.8573 539,312.5568" fill="none" id="xfer-to-cb" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="539,318.5568,543,309.5568,539,313.5568,535,309.5568,539,318.5568" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="52.5776" x="569.0469" y="269.4702">libusb fires</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="110.6714" x="540" y="280.4702">after num_iso_packets</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="69.1045" x="560.7834" y="291.4702">are scheduled</text></g><!--link cb to result--><g class="link" data-entity-1="cb" data-entity-2="result" data-source-line="30" data-uid="lnk15" id="link_