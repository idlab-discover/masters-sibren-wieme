<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="949px" preserveAspectRatio="none" style="width:892px;height:949px;background:#FFFFFF;" version="1.1" viewBox="0 0 892 949" width="892px" zoomAndPan="magnify"><title>C4 build pipeline &#8212; rusb &#8594; wasm32-wasip2 (no upstream forks)</title><defs/><g><g class="title" data-source-line="8"><text fill="#000000" font-family="'Helvetica'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="671.1396" x="106.0999" y="31.9404">C4 build pipeline &#8212; rusb &#8594; wasm32-wasip2 (no upstream forks)</text></g><!--entity src--><g class="entity" data-entity="src" data-source-line="21" data-uid="ent0002" id="entity_src"><rect fill="#DCEFFB" height="64" rx="4" ry="4" style="stroke:#2C7BB6;stroke-width:1;" width="203.9814" x="330.01" y="214"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="36.0884" x="413.9565" y="232.4702">&#171;input&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="105.7676" x="340.01" y="243.4702">Rust workload source</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="183.9814" x="340.01" y="254.4702">w_bulk.rs, w_ctrl.rs, w_int.rs, w_iso.rs</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="70.2915" x="340.01" y="265.4702">``use rusb::*;``</text></g><!--entity rusb--><g class="entity" data-entity="rusb" data-source-line="22" data-uid="ent0003" id="entity_rusb"><rect fill="#EDEDED" height="53" rx="4" ry="4" style="stroke:#888888;stroke-width:1;" width="125.7783" x="169.11" y="351"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="51.3691" x="206.3146" y="369.4702">&#171;external&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="48.9092" x="179.11" y="380.4702">rusb crate</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="105.7783" x="179.11" y="391.4702">upstream, unmodified</text></g><!--entity sys--><g class="entity" data-entity="sys" data-source-line="23" data-uid="ent0004" id="entity_sys"><rect fill="#EDEDED" height="64" rx="4" ry="4" style="stroke:#888888;stroke-width:1;" width="182.0029" x="12" y="482.5"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="51.3691" x="77.3169" y="500.9702">&#171;external&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="82.5322" x="22" y="511.9702">libusb1-sys crate</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="105.7783" x="22" y="522.9702">upstream, unmodified</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="162.0029" x="22" y="533.9702">``build.rs &#8594; pkg_config::probe()``</text></g><!--entity sysroot--><g class="entity" data-entity="sysroot" data-source-line="24" data-uid="ent0005" id="entity_sysroot"><rect fill="#FFEBC8" height="75" rx="4" ry="4" style="stroke:#C0823F;stroke-width:1;" width="179.5645" x="371.22" y="477"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="41.5884" x="440.208" y="495.4702">&#171;config&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="70.3022" x="381.22" y="506.4702">sysroot-wasi/</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="159.5645" x="381.22" y="517.4702">``usr/lib/pkgconfig/libusb-1.0.pc``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="131.4307" x="381.22" y="528.4702">``-L${prefix}/../libusb-wasi``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="86.1631" x="381.22" y="539.4702">``-lusb-wasi-rust``</text></g><!--entity a--><g class="entity" data-entity="a" data-source-line="25" data-uid="ent0006" id="entity_a"><rect fill="#EDEDED" height="53" rx="4" ry="4" style="stroke:#888888;stroke-width:1;" width="148.3906" x="394.81" y="632.5"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="51.3691" x="443.3207" y="650.9702">&#171;external&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="69.0723" x="404.81" y="661.9702">libusb-wasi.a</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="128.3906" x="404.81" y="672.9702">Robbe Leroy, WIT-backed</text></g><!--entity gct--><g class="entity" data-entity="gct" data-source-line="26" data-uid="ent0007" id="entity_gct"><rect fill="#EDEDED" height="64" rx="4" ry="4" style="stroke:#888888;stroke-width:1;" width="153.2407" x="683.38" y="627"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="51.3691" x="734.3158" y="645.4702">&#171;external&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="133.2407" x="693.38" y="656.4702">guest_component_type.o</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="127.7998" x="693.38" y="667.4702">component-type metadata</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="108.1953" x="693.38" y="678.4702">(from C2 cmake build)</text></g><!--entity cargo--><g class="entity" data-entity="cargo" data-source-line="33" data-uid="ent0012" id="entity_cargo"><rect fill="#FFEBC8" height="86" rx="4" ry="4" style="stroke:#C0823F;stroke-width:1;" width="174.0215" x="435.99" y="55"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="41.5884" x="502.2066" y="73.4702">&#171;config&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.9253" x="445.99" y="84.4702">benchmarks/build-c4.sh</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="61.1392" x="445.99" y="95.4702">``cargo build</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" text-decoration="line-through" textLength="36.0776" x="510.1853" y="95.4702">release</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="27.5054" x="549.3191" y="95.4702">bins``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="138.1392" x="445.99" y="106.4702">``  --target wasm32-wasip2``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="133.2407" x="445.99" y="117.4702">``  --features c4-rusb-wasi``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="154.0215" x="445.99" y="128.4702">``  --target-dir target-wasi-rusb``</text></g><!--entity buildrs--><g class="entity" data-entity="buildrs" data-source-line="35" data-uid="ent0013" id="entity_buildrs"><rect fill="#FFEBC8" height="53" rx="4" ry="4" style="stroke:#C0823F;stroke-width:1;" width="220.6694" x="665.67" y="488"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="41.5884" x="755.2105" y="506.4702">&#171;config&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="180.3184" x="675.67" y="517.4702">benchmarks/usb-bench-rs/build.rs</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="200.6694" x="675.67" y="528.4702">``println!(\"cargo:rustc-link-arg={}\", gct);``</text></g><!--entity wasm--><g class="entity" data-entity="wasm" data-source-line="40" data-uid="ent0016" id="entity_wasm"><rect fill="#D5EAD8" height="64" rx="4" ry="4" style="stroke:#4B8B5A;stroke-width:1;" width="169.9663" x="528.02" y="752"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="42.8184" x="591.594" y="770.4702">&#171;output&#187;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="52.583" x="538.02" y="781.4702">w_*.wasm</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="85.5938" x="538.02" y="792.4702">WASI component</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="149.9663" x="538.02" y="803.4702">imports component:usb@0.2.1</text></g><g class="entity" data-entity="GMN20" data-source-line="47" data-uid="ent0021" id="entity_GMN20"><path d="M441.59,881 L441.59,938 A4,4 0 0 0 445.59,942 L780.4206,942 A4,4 0 0 0 784.4206,938 L784.4206,887 L774.4206,877 L617,877 L613,816.48 L609,877 L445.59,877 A4,4 0 0 0 441.59,881" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M774.4206,877 L774.4206,885 A2,2 0 0 0 776.4206,887 L784.4206,887 L774.4206,877" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.9038" x="447.59" y="890.4702">Verification</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="3.0562" x="507.4938" y="890.4702">:</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="321.8306" x="447.59" y="901.4702">``wasm-tools print w_bulk.wasm | grep "import .*component:usb"``</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="271.4282" x="447.59" y="912.4702">Should list device, transfers, descriptors, errors imports.</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="283.6636" x="447.59" y="923.4702">Confirms the rusb-call chain reaches the WIT host runtime</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="281.2251" x="447.59" y="934.4702">via libusb-wasi.a &#8212; without modifying rusb or libusb1-sys.</text></g><!--link src to rusb--><g class="link" data-entity-1="src" data-entity-2="rusb" data-source-line="28" data-uid="lnk8" id="link_src_rusb"><path d="M383.59,278.35 C349.37,300.51 309.0869,326.5897 276.9369,347.3997" fill="none" id="src-to-rusb" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="271.9,350.66,281.6289,349.1275,276.0974,347.9431,277.2818,342.4116,271.9,350.66" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="42.2061" x="333" y="317.4702">depends</text></g><!--link rusb to sys--><g class="link" data-entity-1="rusb" data-entity-2="sys" data-source-line="29" data-uid="lnk9" id="link_rusb_sys"><path d="M207.43,404.21 C186.23,426.4 159.6954,454.1723 137.0654,477.8523" fill="none" id="rusb-to-sys" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="132.92,482.19,142.0299,478.447,136.3745,478.5752,136.2463,472.9198,132.92,482.19" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'"